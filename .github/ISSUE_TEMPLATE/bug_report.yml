name: Bug report
description: Report a bug in the pipeline, server, or web interface.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline
        - Server / API
        - Web UI
        - Taxonomy / classification
        - Containers / docs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Commands, query URL, or inputs that trigger the issue.

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Linux / macOS, Node 22, Python 3.12
