name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r pipeline/requirements.lock

      - name: Install Node dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Check short-link codes
        run: npm run link-codes -- --check

      - name: Build site
        run: npm run build
